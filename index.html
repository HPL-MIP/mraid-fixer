<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRAID Fixer &mdash; Ad Compliance Tool</title>
  <meta name="description"
    content="Upload multiple HTML ad creatives and automatically fix MRAID v2.0 compliance issues in batch." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg-base: #090b10;
      --bg-card: #141922;
      --border: rgba(255, 255, 255, 0.07);
      --border-active: rgba(99, 179, 237, 0.35);
      --accent-blue: #63b3ed;
      --accent-green: #68d391;
      --accent-amber: #f6ad55;
      --accent-red: #fc8181;
      --accent-purple: #b794f4;
      --grd-blue: linear-gradient(135deg, #3182ce, #63b3ed);
      --grd-green: linear-gradient(135deg, #276749, #68d391);
      --grd-purple: linear-gradient(135deg, #553c9a, #b794f4);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #4a5568;
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-xl: 24px;
      --shadow: 0 4px 24px rgba(0, 0, 0, .4);
      --glow: 0 0 40px rgba(99, 179, 237, .12);
      --ease: .22s cubic-bezier(.4, 0, .2, 1);
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99, 102, 241, .08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(99, 179, 237, .06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    header {
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      background: rgba(9, 11, 16, .7);
      position: sticky;
      top: 0;
      z-index: 100
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--grd-blue);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 18px rgba(99, 179, 237, .3);
      flex-shrink: 0
    }

    .logo-text {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.3px
    }

    .logo-text span {
      color: var(--accent-blue)
    }

    .hdr-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .04);
      padding: 4px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      margin-left: 12px;
    }

    .hdr-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--ease);
      border: 1px solid transparent;
    }

    .hdr-nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .1);
    }

    .hdr-nav-link.active {
      background: rgba(99, 179, 237, .18);
      color: #fff;
      border-color: rgba(99, 179, 237, .4);
      box-shadow: 0 0 16px rgba(99, 179, 237, .2);
    }

    .hdr-nav-link .nav-icon {
      font-size: 15px;
    }

    .hdr-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .hdr-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(99, 179, 237, .12);
      border: 1px solid rgba(99, 179, 237, .25);
      color: var(--accent-blue)
    }

    .btn-exp-all {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: var(--r-md);
      background: var(--grd-purple);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--ease);
      box-shadow: 0 4px 14px rgba(183, 148, 244, .22)
    }

    .btn-exp-all.visible {
      display: inline-flex
    }

    .btn-exp-all:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(183, 148, 244, .32)
    }

    .btn-clr-all {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--r-md);
      background: rgba(252, 129, 129, .1);
      border: 1px solid rgba(252, 129, 129, .2);
      color: var(--accent-red);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--ease)
    }

    .btn-clr-all.visible {
      display: inline-flex
    }

    .btn-clr-all:hover {
      background: rgba(252, 129, 129, .18);
      border-color: rgba(252, 129, 129, .4)
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px;
      gap: 28px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%
    }

    .dz {
      border: 2px dashed var(--border-active);
      border-radius: var(--r-xl);
      padding: 52px 40px;
      text-align: center;
      cursor: pointer;
      transition: var(--ease);
      background: rgba(99, 179, 237, .02);
      position: relative;
      overflow: hidden
    }

    .dz::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 50%, rgba(99, 179, 237, .06) 0%, transparent 70%);
      opacity: 0;
      transition: var(--ease)
    }

    .dz:hover::before,
    .dz.over::before {
      opacity: 1
    }

    .dz:hover,
    .dz.over {
      border-color: var(--accent-blue);
      background: rgba(99, 179, 237, .05);
      box-shadow: var(--glow)
    }

    .dz.over {
      transform: scale(1.005)
    }

    .dz-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(99, 179, 237, .1);
      border: 1px solid rgba(99, 179, 237, .2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 18px;
      transition: var(--ease)
    }

    .dz:hover .dz-icon,
    .dz.over .dz-icon {
      transform: translateY(-4px);
      background: rgba(99, 179, 237, .18)
    }

    .dz-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px
    }

    .dz-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px
    }

    .dz-sub span {
      color: var(--accent-blue);
      font-weight: 500
    }

    .dz-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 14px
    }

    .btn-up {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--r-md);
      background: var(--grd-blue);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--ease);
      box-shadow: 0 4px 14px rgba(99, 179, 237, .25)
    }

    .btn-up:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(99, 179, 237, .35)
    }

    #fi {
      display: none
    }

    .prog-wrap {
      height: 3px;
      background: rgba(255, 255, 255, .05);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 14px;
      display: none
    }

    .prog-bar {
      height: 100%;
      border-radius: 2px;
      background: var(--grd-blue);
      transition: width .3s ease;
      width: 0%
    }

    .tabs-row {
      display: flex;
      align-items: center;
      overflow-x: auto;
      border-bottom: 1px solid var(--border)
    }

    .tabs-row::-webkit-scrollbar {
      height: 3px
    }

    .tabs-row::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: var(--ease);
      white-space: nowrap;
      flex-shrink: 0;
      margin-bottom: -1px
    }

    .tab:hover {
      color: var(--text-secondary)
    }

    .tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue)
    }

    .tab-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(104, 211, 145, .15);
      color: var(--accent-green)
    }

    .tab-badge.has-fixes {
      background: rgba(246, 173, 85, .15);
      color: var(--accent-amber)
    }

    .tab-badge.has-warns {
      background: rgba(246, 173, 85, .12);
      color: var(--accent-amber)
    }

    .tab-badge.has-fails {
      background: rgba(252, 129, 129, .18);
      color: var(--accent-red);
      border: 1px solid rgba(252, 129, 129, .35)
    }

    .tab-name {
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-muted);
      transition: var(--ease);
      flex-shrink: 0;
      margin-left: 2px;
      cursor: pointer
    }

    .tab-close:hover {
      background: rgba(252, 129, 129, .2);
      color: var(--accent-red)
    }

    #rp {
      display: none;
      flex-direction: column;
      gap: 22px
    }

    #rp.vis {
      display: flex
    }

    .fbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg)
    }

    .ficon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(184, 130, 255, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0
    }

    .fmeta {
      flex: 1;
      min-width: 0
    }

    .fname {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .fsize {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px
    }

    .sec-lbl {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px
    }

    .card {
      padding: 14px 16px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: flex-start;
      gap: 11px;
      transition: var(--ease);
      animation: fadeUp .35s ease both
    }

    .card:nth-child(1) {
      animation-delay: .04s
    }

    .card:nth-child(2) {
      animation-delay: .08s
    }

    .card:nth-child(3) {
      animation-delay: .12s
    }

    .card:nth-child(4) {
      animation-delay: .16s
    }

    .card:nth-child(5) {
      animation-delay: .20s
    }

    .card:nth-child(6) {
      animation-delay: .24s
    }

    .card:nth-child(7) {
      animation-delay: .28s
    }

    .card:nth-child(8) {
      animation-delay: .32s
    }

    .card:nth-child(9) {
      animation-delay: .36s
    }

    .card:nth-child(10) {
      animation-delay: .40s
    }

    .card:nth-child(11) {
      animation-delay: .44s
    }

    .card.pass {
      border-color: rgba(104, 211, 145, .22);
      background: rgba(104, 211, 145, .03)
    }

    .card.fixed {
      border-color: rgba(246, 173, 85, .22);
      background: rgba(246, 173, 85, .03)
    }

    .card.warn {
      border-color: rgba(246, 173, 85, .22);
      background: rgba(246, 173, 85, .03)
    }

    .card.fail {
      border-color: rgba(252, 129, 129, .35);
      background: rgba(252, 129, 129, .05)
    }

    .cico {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px
    }

    .cbody {
      flex: 1;
      min-width: 0
    }

    .ctitle {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap
    }

    .cdesc {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.55
    }

    .badge {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 20px;
      white-space: nowrap
    }

    .b-pass {
      background: rgba(104, 211, 145, .15);
      color: var(--accent-green)
    }

    .b-fixed,
    .b-warn {
      background: rgba(246, 173, 85, .15);
      color: var(--accent-amber)
    }

    .b-fail {
      background: rgba(252, 129, 129, .18);
      color: var(--accent-red);
      border: 1px solid rgba(252, 129, 129, .3)
    }

    .sbar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      background: var(--bg-card);
      flex-wrap: wrap;
      gap: 12px
    }

    .sstat {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .sdot {
      width: 7px;
      height: 7px;
      border-radius: 50%
    }

    .dp {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green)
    }

    .df {
      background: var(--accent-amber);
      box-shadow: 0 0 6px var(--accent-amber)
    }

    .dw {
      background: var(--accent-amber);
      box-shadow: 0 0 6px var(--accent-amber)
    }

    .dfl {
      background: var(--accent-red);
      box-shadow: 0 0 6px var(--accent-red)
    }

    .slbl {
      font-size: 13px;
      color: var(--text-secondary)
    }

    .snum {
      font-size: 13px;
      font-weight: 700
    }

    .ssep {
      width: 1px;
      height: 16px;
      background: var(--border)
    }

    .exp-area {
      margin-left: auto
    }

    .btn-exp {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--r-md);
      background: var(--grd-green);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--ease);
      box-shadow: 0 4px 14px rgba(104, 211, 145, .2)
    }

    .btn-exp:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(104, 211, 145, .3)
    }

    .btn-exp:disabled,
    .btn-exp.disabled {
      background: rgba(252, 129, 129, .1) !important;
      color: rgba(252, 129, 129, .8) !important;
      border: 1px solid rgba(252, 129, 129, .3) !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
      transform: none !important;
      opacity: .85
    }

    .btn-exp-all.disabled {
      opacity: .5;
      cursor: not-allowed !important;
      transform: none !important;
      box-shadow: none !important
    }

    .block-banner {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 22px;
      border-radius: var(--r-lg);
      background: linear-gradient(135deg, rgba(252, 129, 129, .12), rgba(229, 62, 62, .04));
      border: 1px solid rgba(252, 129, 129, .35);
      box-shadow: 0 4px 24px rgba(252, 129, 129, .12);
      animation: fadeUp .3s ease both
    }

    .bb-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(252, 129, 129, .18);
      border: 1px solid rgba(252, 129, 129, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0
    }

    .bb-content {
      flex: 1;
      min-width: 0
    }

    .bb-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .bb-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.6
    }

    .bb-desc strong {
      color: #fca5a5
    }

    .bb-tags {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .bb-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(252, 129, 129, .16);
      border: 1px solid rgba(252, 129, 129, .3);
      color: var(--accent-red)
    }

    .audit-sec {
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-radius: var(--r-lg);
      background: var(--bg-card);
      border: 1px solid rgba(252, 129, 129, .25);
      padding: 20px;
      animation: fadeUp .35s ease both
    }

    .audit-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px
    }

    .audit-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .af-btn {
      padding: 5px 12px;
      border-radius: var(--r-sm);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--ease)
    }

    .af-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, .08)
    }

    .af-btn.active {
      background: rgba(252, 129, 129, .18);
      border-color: rgba(252, 129, 129, .4);
      color: var(--accent-red)
    }

    .v-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px
    }

    .v-list::-webkit-scrollbar {
      width: 4px
    }

    .v-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px
    }

    .v-item {
      padding: 13px 16px;
      border-radius: var(--r-md);
      background: rgba(9, 11, 16, .75);
      border: 1px solid rgba(255, 255, 255, .06);
      border-left: 3px solid var(--accent-red);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: var(--ease);
      animation: fadeUp .25s ease both
    }

    .v-item:hover {
      border-color: rgba(252, 129, 129, .3);
      background: rgba(14, 18, 25, .85)
    }

    .v-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .v-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 12px
    }

    .v-line {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted)
    }

    .v-rule {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary)
    }

    .v-snippet {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      background: rgba(0, 0, 0, .45);
      border: 1px solid rgba(255, 255, 255, .05);
      border-radius: var(--r-sm);
      padding: 7px 12px;
      color: #fca5a5;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto
    }

    .v-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.55
    }

    .v-desc strong {
      color: var(--accent-amber)
    }

    .v-empty {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px
    }

    .diff-sec {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .diff-tog {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none
    }

    .dtog-ico {
      transition: transform var(--ease);
      font-size: 11px;
      color: var(--text-muted);
      display: inline-block
    }

    .dtog-ico.open {
      transform: rotate(90deg)
    }

    .dtog-lbl {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted)
    }

    .dcnt-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(246, 173, 85, .15);
      color: var(--accent-amber)
    }

    .diff-wrap {
      display: none;
      flex-direction: column;
      gap: 9px;
      max-height: 420px;
      overflow-y: auto
    }

    .diff-wrap.open {
      display: flex
    }

    .diff-wrap::-webkit-scrollbar {
      width: 4px
    }

    .diff-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px
    }

    .ditem {
      border-radius: var(--r-md);
      border: 1px solid rgba(246, 173, 85, .18);
      background: var(--bg-card);
      overflow: hidden;
      animation: fadeUp .3s ease both
    }

    .dhdr {
      padding: 9px 13px;
      background: rgba(246, 173, 85, .07);
      border-bottom: 1px solid rgba(246, 173, 85, .13);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-amber)
    }

    .dlines {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.7
    }

    .dline {
      padding: 2px 13px;
      white-space: pre-wrap;
      word-break: break-all
    }

    .dline.rem {
      background: rgba(252, 129, 129, .07);
      color: #fc8181
    }

    .dline.add {
      background: rgba(104, 211, 145, .07);
      color: #68d391
    }

    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 11px 16px;
      border-radius: var(--r-md);
      background: #1a202c;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      transition: var(--ease);
      z-index: 999;
      pointer-events: none
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @media(max-width:760px) {
      header {
        padding: 14px 20px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .hdr-nav {
        order: 3;
        width: 100%;
        margin-left: 0;
        justify-content: center;
      }

      main {
        padding: 20px;
        gap: 20px
      }

      .dz {
        padding: 36px 20px
      }

      .grid {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="logo-icon">&#x26A1;</div>
        <div class="logo-text">MRAID<span>Fixer</span></div>
      </div>

      <!-- Navigation to both routes -->
      <nav class="hdr-nav" aria-label="Tool Navigation">
        <a href="index.html" class="hdr-nav-link active" title="MRAID v2.0 Compliance Fixer">
          <span class="nav-icon">🛡️</span> MRAID Fixer
        </a>
        <a href="compressor/index.html" class="hdr-nav-link" title="Creative Compressor & Video Optimizer">
          <span class="nav-icon">🗜️</span> Creative Compressor
        </a>
      </nav>

      <div class="hdr-right">
        <div class="hdr-badge">v2.0 Compliant</div>
        <button class="btn-exp-all" id="btn-exp-all" type="button">&#x2B07; <span>Export All</span></button>
        <button class="btn-clr-all" id="btn-clr-all" type="button">&#x2715; <span>Clear All</span></button>
      </div>
    </header>
    <main>
      <section id="dz" class="dz" role="button" tabindex="0" aria-label="Upload HTML creatives">
        <div class="dz-icon">&#x1F4C2;</div>
        <div class="dz-title">Drop your HTML ad creatives here</div>
        <div class="dz-sub">Automatically detects &amp; fixes <span>MRAID v2.0</span> compliance issues</div>
        <button class="btn-up" id="btn-pick" type="button">&#x2B06; Browse Files</button>
        <input type="file" id="fi" accept=".html,.htm" multiple />
        <div class="dz-hint">Supports multiple files &mdash; drag &amp; drop a batch or hold Ctrl to select several
        </div>
        <div class="prog-wrap" id="pw">
          <div class="prog-bar" id="pb"></div>
        </div>
      </section>
      <div id="tabs-container" style="display:none">
        <div class="tabs-row" id="tabs-row"></div>
      </div>
      <div id="rp">
        <div id="panels-host"></div>
      </div>
    </main>
  </div>
  <div id="toast"></div>
  <script>
    /* MRAID FIXER ENGINE - Multi-file edition
       MRAID v2.0 + AppLovin MIP compliance (MRAID.md)
       \x3c/script> in string literals prevents premature HTML tag closing.
    */
    (function () {
      'use strict';
      var dzEl = document.getElementById('dz'),
        fi = document.getElementById('fi'),
        btnPick = document.getElementById('btn-pick'),
        rp = document.getElementById('rp'),
        pbEl = document.getElementById('pb'),
        tabsContainer = document.getElementById('tabs-container'),
        tabsRow = document.getElementById('tabs-row'),
        panelsHost = document.getElementById('panels-host'),
        btnExpAll = document.getElementById('btn-exp-all'),
        btnClrAll = document.getElementById('btn-clr-all'),
        toast = document.getElementById('toast');

      var files = [], activeId = null, idCounter = 0;

      function fmtBytes(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB'; }
      var toastT;
      function showToast(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { toast.classList.remove('show'); }, 3400); }
      function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
      function trunc(s, n) { s = String(s); n = n || 130; return s.length > n ? s.substring(0, n) + '...' : s; }
      function uid() { return 'f' + (++idCounter); }
      function setProg(pct) { var pw = document.getElementById('pw'); if (pct > 0 && pct < 100) { pw.style.display = 'block'; pbEl.style.width = pct + '%'; } else { pw.style.display = 'none'; } }

      function getLineNum(str, pos) {
        if (pos === undefined || pos === null || pos < 0 || !str) return null;
        return str.substring(0, pos).split('\n').length;
      }
      function findSnippetLine(origText, snippet) {
        if (!snippet || !origText) return null;
        var idx = origText.indexOf(snippet);
        if (idx === -1) {
          var sub = snippet.substring(0, Math.min(40, snippet.length));
          idx = origText.indexOf(sub);
        }
        return idx !== -1 ? origText.substring(0, idx).split('\n').length : null;
      }

      btnPick.addEventListener('click', function (e) { e.stopPropagation(); fi.click(); });
      dzEl.addEventListener('click', function () { fi.click(); });
      dzEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') fi.click(); });
      fi.addEventListener('change', function (e) { handleFileList(e.target.files); fi.value = ''; });
      dzEl.addEventListener('dragover', function (e) { e.preventDefault(); dzEl.classList.add('over'); });
      dzEl.addEventListener('dragleave', function (e) { if (!dzEl.contains(e.relatedTarget)) dzEl.classList.remove('over'); });
      dzEl.addEventListener('drop', function (e) {
        e.preventDefault(); dzEl.classList.remove('over');
        var dropped = e.dataTransfer.files, htmlFiles = [];
        for (var i = 0; i < dropped.length; i++) { if (/\.html?$/i.test(dropped[i].name)) htmlFiles.push(dropped[i]); }
        if (htmlFiles.length) handleFileList(htmlFiles); else showToast('\u26A0\uFE0F Please drop .html files');
      });

      function handleFileList(fileList) {
        var arr = Array.prototype.slice.call(fileList).filter(function (f) { return /\.html?$/i.test(f.name); });
        if (!arr.length) { showToast('\u26A0\uFE0F No .html files found'); return; }
        var total = arr.length, done = 0;
        setProg(5);
        arr.forEach(function (file) {
          var reader = new FileReader();
          reader.onload = function (e) {
            done++;
            setProg(Math.round(5 + (done / total) * 90));
            var entry = { id: uid(), name: file.name, size: file.size, origHTML: e.target.result, fixedHTML: '', results: [], diffs: [], blockingViolations: [], extCallViolations: [], nonB64B122Violations: [] };
            runFix(entry);
            files.push(entry);
            renderTabsAndPanels();
            setActive(entry.id);
            if (done === total) {
              setProg(100);
              var fc = files.reduce(function (acc, f) { return acc + f.results.filter(function (r) { return r.status === 'fixed'; }).length; }, 0);
              var flc = files.reduce(function (acc, f) { return acc + (f.blockingViolations ? f.blockingViolations.length : 0); }, 0);
              if (flc > 0) {
                showToast('\u26A0\uFE0F Processed ' + total + ' file' + (total > 1 ? 's' : '') + ' \u2014 ' + flc + ' blocking violation' + (flc > 1 ? 's' : '') + ' detected');
              } else {
                showToast(total > 1 ? '\uD83D\uDD27 ' + total + ' files processed, ' + fc + ' fix' + (fc !== 1 ? 'es' : '') + ' applied' : fc > 0 ? '\uD83D\uDD27 ' + fc + ' issue' + (fc > 1 ? 's' : '') + ' fixed' : '\u2705 All checks passed');
              }
            }
          };
          reader.readAsText(file);
        });
      }

      function renderTabsAndPanels() {
        var has = files.length > 0;
        tabsContainer.style.display = has ? 'block' : 'none';
        rp.style.display = has ? 'flex' : 'none';
        rp.classList.toggle('vis', has);
        btnExpAll.classList.toggle('visible', has);
        btnClrAll.classList.toggle('visible', has);
        var anyCompliant = files.some(function (f) { return !f.blockingViolations || f.blockingViolations.length === 0; });
        btnExpAll.classList.toggle('disabled', !anyCompliant && has);
        btnExpAll.title = !anyCompliant && has ? 'Export blocked: all files contain critical violations' : 'Export all compliant files';
        tabsRow.innerHTML = '';
        files.forEach(function (entry) {
          var fc = entry.results.filter(function (r) { return r.status === 'fixed'; }).length;
          var wc = entry.results.filter(function (r) { return r.status === 'warn'; }).length;
          var flc = entry.blockingViolations ? entry.blockingViolations.length : 0;
          var bCls = flc > 0 ? 'has-fails' : fc > 0 ? 'has-fixes' : wc > 0 ? 'has-warns' : '';
          var bTxt = flc > 0 ? flc + ' blocked' : fc > 0 ? fc + ' fix' + (fc > 1 ? 'es' : '') : wc > 0 ? wc + ' warn' : '\u2713 clean';
          var tab = document.createElement('div');
          tab.className = 'tab' + (entry.id === activeId ? ' active' : '');
          tab.dataset.id = entry.id;
          tab.innerHTML =
            '<span class="tab-name" title="' + esc(entry.name) + '">' + esc(entry.name) + '</span>' +
            '<span class="tab-badge ' + bCls + '">' + bTxt + '</span>' +
            '<span class="tab-close" data-close="' + entry.id + '" title="Remove">&#x2715;</span>';
          tab.addEventListener('click', function (e) {
            if (e.target.dataset.close) { removeFile(e.target.dataset.close); return; }
            setActive(entry.id);
          });
          tabsRow.appendChild(tab);
        });
        panelsHost.innerHTML = '';
        var active = null;
        for (var i = 0; i < files.length; i++) { if (files[i].id === activeId) { active = files[i]; break; } }
        if (active) renderPanel(active);
      }

      function setActive(id) { activeId = id; renderTabsAndPanels(); var at = tabsRow.querySelector('.tab.active'); if (at) at.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }

      function removeFile(id) {
        var idx = -1;
        for (var i = 0; i < files.length; i++) { if (files[i].id === id) { idx = i; break; } }
        if (idx === -1) return;
        files.splice(idx, 1);
        if (activeId === id) activeId = files.length ? files[Math.max(0, idx - 1)].id : null;
        if (!files.length) { tabsContainer.style.display = 'none'; rp.style.display = 'none'; rp.classList.remove('vis'); btnExpAll.classList.remove('visible'); btnClrAll.classList.remove('visible'); }
        else renderTabsAndPanels();
      }

      btnClrAll.addEventListener('click', function () {
        files = []; activeId = null; tabsRow.innerHTML = ''; panelsHost.innerHTML = '';
        tabsContainer.style.display = 'none'; rp.style.display = 'none'; rp.classList.remove('vis');
        btnExpAll.classList.remove('visible'); btnClrAll.classList.remove('visible');
        showToast('Cleared all files');
      });

      btnExpAll.addEventListener('click', function () {
        if (!files.length) return;
        var compliant = files.filter(function (f) { return !f.blockingViolations || f.blockingViolations.length === 0; });
        var blocked = files.filter(function (f) { return f.blockingViolations && f.blockingViolations.length > 0; });
        if (!compliant.length) {
          showToast('\uD83D\uDEAB Export blocked: All ' + files.length + ' file' + (files.length > 1 ? 's contain' : ' contains') + ' critical compliance violations!');
          return;
        }
        compliant.forEach(function (entry, i) {
          setTimeout(function () { dlFile(entry); }, i * 120);
        });
        if (blocked.length > 0) {
          showToast('\u26A0\uFE0F Exported ' + compliant.length + ' compliant file' + (compliant.length > 1 ? 's' : '') + '. ' + blocked.length + ' file' + (blocked.length > 1 ? 's' : '') + ' blocked due to violations.');
        } else {
          showToast('\u2B07 Exporting ' + compliant.length + ' compliant file' + (compliant.length > 1 ? 's' : '') + '...');
        }
      });

      function dlFile(entry) {
        var blocking = entry.blockingViolations || [];
        if (blocking.length > 0) {
          showToast('\uD83D\uDEAB Export blocked: ' + blocking.length + ' critical violation' + (blocking.length !== 1 ? 's' : '') + ' must be resolved first.');
          return;
        }
        var b = new Blob([entry.fixedHTML], { type: 'text/html' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = entry.name.replace(/\.html?$/i, '') + '_mraid_fixed.html';
        a.click(); URL.revokeObjectURL(a.href);
      }

      var EMOJI = { pass: '&#x2705;', fixed: '&#x1F527;', warn: '&#x26A0;&#xFE0F;', fail: '&#x274C;' };

      function renderPanel(entry) {
        var pc = 0, fc = 0, wc = 0, flc = 0;
        entry.results.forEach(function (r) {
          if (r.status === 'pass') pc++;
          else if (r.status === 'fixed') fc++;
          else if (r.status === 'warn') wc++;
          else if (r.status === 'fail') flc++;
        });
        var blocking = entry.blockingViolations || [];
        var isBlocked = blocking.length > 0 || flc > 0;

        var panel = document.createElement('div');
        panel.style.cssText = 'display:flex;flex-direction:column;gap:20px;animation:fadeUp .25s ease both';

        var fbar = document.createElement('div'); fbar.className = 'fbar';
        var statusBadge = isBlocked
          ? '<span class="badge b-fail" style="margin-left:8px">\uD83D\uDEAB Export Blocked (' + blocking.length + ' issue' + (blocking.length !== 1 ? 's' : '') + ')</span>'
          : '<span class="badge b-pass" style="margin-left:8px">\u2713 Export Ready</span>';
        fbar.innerHTML =
          '<div class="ficon">' + (isBlocked ? '\uD83D\uDEAB' : '\uD83D\uDCE6') + '</div>' +
          '<div class="fmeta"><div class="fname">' + esc(entry.name) + statusBadge + '</div><div class="fsize">' + fmtBytes(entry.size) + '</div></div>' +
          '<button class="btn-exp ' + (isBlocked ? 'disabled' : '') + '" type="button" ' + (isBlocked ? 'disabled' : '') + '>' +
          (isBlocked ? '\uD83D\uDEAB Export Blocked' : '\u2B07 Export Fixed HTML') +
          '</button>';

        var expBtn = fbar.querySelector('.btn-exp');
        if (isBlocked) {
          expBtn.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            showToast('\uD83D\uDEAB Export blocked: ' + blocking.length + ' critical violation' + (blocking.length !== 1 ? 's' : '') + ' must be resolved first.');
          });
        } else {
          expBtn.addEventListener('click', function () {
            dlFile(entry);
            showToast('Exported: ' + entry.name.replace(/\.html?$/i, '') + '_mraid_fixed.html');
          });
        }
        panel.appendChild(fbar);

        if (isBlocked) {
          var extCount = (entry.extCallViolations || []).length;
          var assetCount = (entry.nonB64B122Violations || []).length;

          var banner = document.createElement('div');
          banner.className = 'block-banner';
          banner.innerHTML =
            '<div class="bb-icon">&#x1F6AB;</div>' +
            '<div class="bb-content">' +
            '<div class="bb-title">Export Blocked &mdash; Critical Compliance Violations Detected</div>' +
            '<div class="bb-desc">' +
            'This creative cannot be exported because it contains ' +
            '<strong>' + extCount + ' external network call' + (extCount !== 1 ? 's' : '') + ' / remote resource' + (extCount !== 1 ? 's' : '') + '</strong> and ' +
            '<strong>' + assetCount + ' non-base64/non-base122 asset reference' + (assetCount !== 1 ? 's' : '') + '</strong>. ' +
            'MRAID v2.0 and mobile ad networks (AppLovin MIP, ironSource, Unity) require playable creatives to be 100% self-contained single-file HTML. All assets must be inlined via Base64 or Base122, and all external network calls must be removed.' +
            '</div>' +
            '<div class="bb-tags">' +
            (extCount > 0 ? '<span class="bb-pill">&#x1F310; ' + extCount + ' External Call' + (extCount !== 1 ? 's' : '') + '</span>' : '') +
            (assetCount > 0 ? '<span class="bb-pill">&#x1F5BC;&#xFE0F; ' + assetCount + ' Non-B64/B122 Asset' + (assetCount !== 1 ? 's' : '') + '</span>' : '') +
            '</div>' +
            '</div>';
          panel.appendChild(banner);

          var auditSec = document.createElement('div');
          auditSec.className = 'audit-sec';

          var auditHdr = document.createElement('div');
          auditHdr.className = 'audit-hdr';
          auditHdr.innerHTML =
            '<div class="sec-lbl" style="margin-bottom:0">Violation Details &amp; Asset Report (' + blocking.length + ')</div>' +
            '<div class="audit-filters">' +
            '<button class="af-btn active" type="button" data-f="all">All (' + blocking.length + ')</button>' +
            '<button class="af-btn" type="button" data-f="ext">External Calls (' + extCount + ')</button>' +
            '<button class="af-btn" type="button" data-f="asset">Non-B64/122 Assets (' + assetCount + ')</button>' +
            '</div>';
          auditSec.appendChild(auditHdr);

          var vList = document.createElement('div');
          vList.className = 'v-list';

          function renderViolationItems(filter) {
            vList.innerHTML = '';
            var items = blocking.filter(function (v) {
              if (filter === 'all') return true;
              return v.type === filter;
            });
            if (!items.length) {
              vList.innerHTML = '<div class="v-empty">No violations in this category.</div>';
              return;
            }
            items.forEach(function (item) {
              var el = document.createElement('div');
              el.className = 'v-item';
              el.innerHTML =
                '<div class="v-top">' +
                '<span class="v-badge badge b-fail">' + esc(item.categoryLabel) + '</span>' +
                (item.line ? '<span class="v-line">Line ' + item.line + '</span>' : '') +
                '<span class="v-rule">' + esc(item.rule) + '</span>' +
                '</div>' +
                '<div class="v-snippet">' + esc(trunc(item.snippet, 260)) + '</div>' +
                '<div class="v-desc">' + esc(item.remedy) + '</div>';
              vList.appendChild(el);
            });
          }

          renderViolationItems('all');

          auditHdr.querySelectorAll('.af-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              auditHdr.querySelectorAll('.af-btn').forEach(function (b) { b.classList.remove('active'); });
              btn.classList.add('active');
              renderViolationItems(btn.dataset.f);
            });
          });

          auditSec.appendChild(vList);
          panel.appendChild(auditSec);
        }

        var cw = document.createElement('div');
        var sl = document.createElement('div'); sl.className = 'sec-lbl'; sl.textContent = 'Compliance Checks'; cw.appendChild(sl);
        var g = document.createElement('div'); g.className = 'grid';
        entry.results.forEach(function (r) {
          var card = document.createElement('div'); card.className = 'card ' + r.status;
          card.innerHTML = '<div class="cico">' + EMOJI[r.status] + '</div><div class="cbody"><div class="ctitle">' + esc(r.title) + '<span class="badge b-' + r.status + '">' + r.status + '</span></div><div class="cdesc">' + esc(r.desc) + '</div></div>';
          g.appendChild(card);
        });
        cw.appendChild(g); panel.appendChild(cw);

        var sb = document.createElement('div'); sb.className = 'sbar';
        sb.innerHTML =
          '<div class="sstat"><div class="sdot dp"></div><span class="slbl">Passed</span><span class="snum">' + pc + '</span></div>' +
          '<div class="ssep"></div>' +
          '<div class="sstat"><div class="sdot df"></div><span class="slbl">Fixed</span><span class="snum">' + fc + '</span></div>' +
          '<div class="ssep"></div>' +
          '<div class="sstat"><div class="sdot dw"></div><span class="slbl">Warnings</span><span class="snum">' + wc + '</span></div>' +
          '<div class="ssep"></div>' +
          '<div class="sstat"><div class="sdot dfl"></div><span class="slbl">Blocked</span><span class="snum" style="color:var(--accent-red)">' + flc + '</span></div>';
        panel.appendChild(sb);

        if (entry.diffs.length) {
          var ds = document.createElement('div'); ds.className = 'diff-sec';
          var tog = document.createElement('div'); tog.className = 'diff-tog';
          tog.setAttribute('role', 'button'); tog.setAttribute('tabindex', '0'); tog.setAttribute('aria-expanded', 'false');
          tog.innerHTML = '<span class="dtog-ico">&#x25B6;</span><span class="dtog-lbl">Changes Applied</span><span class="dcnt-badge">' + entry.diffs.length + ' fix' + (entry.diffs.length !== 1 ? 'es' : '') + '</span>';
          var dw = document.createElement('div'); dw.className = 'diff-wrap';
          tog.addEventListener('click', function () { var o = dw.classList.toggle('open'); tog.querySelector('.dtog-ico').classList.toggle('open', o); tog.setAttribute('aria-expanded', String(o)); });
          tog.addEventListener('keydown', function (e) { if (e.key === 'Enter') tog.click(); });

              id: 'ext_calls',
              title: 'External Calls & Remote Endpoints',
              desc: 'CRITICAL: Found ' + extViolations.length + ' external call(s) (network APIs, CDN scripts, remote fonts/media). Playables must be 100% offline self-contained.',
              status: 'fail'
            });
          } else {
            results.push({
              id: 'ext_calls',
              title: 'External Calls & Remote Endpoints',
              desc: 'Clean. Zero external network calls (fetch/XHR/WS/beacon) or remote resource URLs detected (excluding mraid.js). Self-contained.',
              status: 'pass'
            });
          }
        }());

        /* CHECK 11 - Asset Inlining Compliance (Base64 / Base122 Only) */
        (function () {
          var assetViolations = [];

          function isCompliantInline(val) {
            if (!val) return true;
            val = val.trim();
            val = val.replace(/^["'`]|["'`]$/g, '').trim();
            if (!val || val === '#' || val.indexOf('#') === 0 || val === 'about:blank') return true;
            if (/(?:^|\/)mraid(?:\.min)?\.js(?:[?#].*)?$/i.test(val)) return true;
            // Bundler template expressions like `${_hero_png}` or JS string concatenation / variables
            if (val.indexOf('${') !== -1 || val.indexOf('+') !== -1 || val.indexOf('`') !== -1) return true;
            // Base64 Data URI (including image, audio, video, font, octet-stream, gltf, etc.)
            if (/^data:[^;]+(?:;[a-zA-Z0-9.+-]+=[^;]+)*;base64,/i.test(val) || /^data:.*;base64,/i.test(val)) return true;
            // Base122 Data URI
            if (/^data:[^;]+(?:;[a-zA-Z0-9.+-]+=[^;]+)*;base122,/i.test(val) || /^data:.*;base122,/i.test(val)) return true;
            // Inlined SVG Data URI (utf8 or percent-encoded)
            if (/^data:image\/svg\+xml/i.test(val)) return true;
            // In-memory blob URI
            if (/^blob:/i.test(val)) return true;
            return false;
          }

          function addAsset(rule, target, snippet, remedy, index) {
            var line = findSnippetLine(entry.origHTML, snippet) || ((index !== undefined && index !== null) ? getLineNum(entry.origHTML, index) : null);
            for (var i = 0; i < assetViolations.length; i++) {
              if (assetViolations[i].snippet === snippet && assetViolations[i].line === line) return;
            }
            assetViolations.push({
              type: 'asset',
              category: 'Asset Inlining',
              categoryLabel: 'Non-B64/B122 Asset',
              rule: rule,
              target: target,
              snippet: snippet,
              remedy: remedy,
              line: line
            });
          }

          // 1. <img src="...">
          var reImg = /<img\b[^>]*?\bsrc=["']\s*([^"']+)\s*["']/gi, m;
          while ((m = reImg.exec(html)) !== null) {
            var src = (m[1] || '').trim();
            if (!isCompliantInline(src)) {
              var isData = src.indexOf('data:') === 0;
              addAsset(
                isData ? 'Non-Base64/Base122 Data URI' : 'Unbundled Local/Remote Image',
                src,
                m[0],
                isData ? 'Data URI is not Base64 or Base122 encoded. Convert to data:image/...;base64,... or Base122.' : 'Image "' + trunc(src, 40) + '" must be inlined into HTML as Base64 data:image/...;base64,... or Base122.',
                m.index
              );
            }
          }

          // 2. <video>, <audio>, <source>, <track>
          var reMedia = /<(?:video|audio|source|track)\b[^>]*?\bsrc=["']\s*([^"']+)\s*["']/gi;
          while ((m = reMedia.exec(html)) !== null) {
            var mSrc = (m[1] || '').trim();
            if (!isCompliantInline(mSrc)) {
              addAsset(
                'Unbundled Local/Remote Media',
                mSrc,
                m[0],
                'Media asset "' + trunc(mSrc, 40) + '" must be inlined into HTML as Base64 (data:audio/...;base64,...) or Base122.',
                m.index
              );
            }
          }

          // 3. <link href="..."> for stylesheets, fonts, icons
          var reLink = /<link\b[^>]*?\bhref=["']\s*([^"']+)\s*["']/gi;
          while ((m = reLink.exec(html)) !== null) {
            var lHref = (m[1] || '').trim();
            if (!isCompliantInline(lHref)) {
              addAsset(
                'Unbundled Stylesheet/Font File',
                lHref,
                m[0],
                'Linked resource "' + trunc(lHref, 40) + '" must be inlined in <style> or embedded as Base64/Base122 data URI.',
                m.index
              );
            }
          }

          // 4. <script src="..."> (excluding mraid.js)
          var reScript = /<script\b[^>]*?\bsrc=["']\s*([^"']+)\s*["']/gi;
          while ((m = reScript.exec(html)) !== null) {
            var sSrc = (m[1] || '').trim();
            if (!isCompliantInline(sSrc)) {
              addAsset(
                'Unbundled Script File',
                sSrc,
                m[0],
                'Script file "' + trunc(sSrc, 40) + '" must be inlined directly inside \x3cscript>...\x3c/script> tags.',
                m.index
              );
            }
          }

          // 5. CSS url()
          var reCss = /\burl\s*\(\s*([`'"]?)([\s\S]*?)\1\s*\)/gi;
          while ((m = reCss.exec(html)) !== null) {
            var cUrl = (m[2] || '').trim();
            if (cUrl.indexOf('"+') !== -1 || cUrl.indexOf("'+") !== -1 || cUrl.indexOf('+') !== -1) continue;
            if (!cUrl || cUrl === '"' || cUrl === "'" || cUrl.indexOf('w3.org') !== -1 || cUrl.indexOf('schema.org') !== -1) continue;
            if (!isCompliantInline(cUrl)) {
              addAsset(
                'Unbundled CSS url() Asset',
                cUrl,
                m[0],
                'CSS asset "' + trunc(cUrl, 40) + '" must be inlined via Base64 data URI (url("data:...;base64,...")) or Base122.',
                m.index
              );
            }
          }

          // 6. JavaScript dynamic instantiation: new Audio("..."), .src = "..."
          var reJsMedia = /(?:new\s+Audio|\.src\s*=)\s*\(?\s*["'\`]([^"'\`\n]+)["'\`]/gi;
          while ((m = reJsMedia.exec(html)) !== null) {
            var jSrc = (m[1] || '').trim();
            if (/\.(?:png|jpe?g|gif|webp|svg|ico|bmp|avif|mp3|wav|ogg|aac|m4a|mp4|webm|ogv|woff2?|ttf|otf|eot)(?:[?#].*)?$/i.test(jSrc)) {
              if (!isCompliantInline(jSrc)) {
                addAsset(
                  'Dynamic JS Asset File Reference',
                  jSrc,
                  m[0],
                  'JavaScript asset "' + trunc(jSrc, 40) + '" must be replaced with inline Base64 data URI or Base122 decoded string.',
                  m.index
                );
              }
            }
          }

          // 7. fetch() local unbundled assets (e.g. fetch("model.glb"), fetch("./assets/level.json"))
          var reFetchLocal = /\b(?:window\.)?fetch\s*\(\s*([^)]*)\)/gi;
          while ((m = reFetchLocal.exec(html)) !== null) {
            var fVal = (m[1] || '').trim();
            if (!/^["'`]/.test(fVal) || fVal.indexOf('${') !== -1) continue;
            var rawStr = fVal.replace(/^["'`]|["'`]$/g, '').trim();
            if (/^(?:https?:|\/\/)/i.test(rawStr)) continue;
            if (!isCompliantInline(rawStr)) {
              addAsset(
                'Unbundled fetch() Local File Asset',
                rawStr,
                m[0],
                'Local file "' + trunc(rawStr, 40) + '" in fetch() must be converted to Base64 data URI (data:...;base64,...).',
                m.index
              );
            }
          }

          var hasBase122 = /base122|b122/i.test(html);
          var hasB64 = /;base64,/i.test(html);

          entry.nonB64B122Violations = assetViolations;

          if (assetViolations.length > 0) {
            results.push({
              id: 'b64_inline',
              title: 'Asset Inlining (Base64 / Base122)',
              desc: 'CRITICAL: Found ' + assetViolations.length + ' non-base64 / non-base122 asset reference(s). All multimedia assets must be inlined directly via Base64 or Base122.',
              status: 'fail'
            });
          } else {
            var encType = (hasB64 && hasBase122) ? 'Base64 & Base122' : hasBase122 ? 'Base122' : hasB64 ? 'Base64' : 'DOM/Vector';
            results.push({
              id: 'b64_inline',
              title: 'Asset Inlining (Base64 / Base122)',
              desc: 'Clean. Inlined (' + encType + ') assets verified. Zero unbundled local file paths or external asset references detected.',
              status: 'pass'
            });
          }
        }());

        entry.blockingViolations = (entry.extCallViolations || []).concat(entry.nonB64B122Violations || []);
        entry.fixedHTML = html; entry.results = results; entry.diffs = diffs;
      }

    }());
  </script>
</body>
